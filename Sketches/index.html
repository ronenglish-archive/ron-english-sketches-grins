<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sketches: Grins</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101014;
      --panel: rgba(255,255,255,0.06);
      --line: rgba(255,255,255,0.16);
      --text: #f5f2ea;
      --muted: rgba(245,242,234,0.72);
      --accent: #f5d36f;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 25% 20%, rgba(245, 211, 111, 0.16), transparent 30rem),
        radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.08), transparent 26rem),
        var(--bg);
      color: var(--text);
    }
    main {
      width: min(920px, calc(100vw - 2rem));
      padding: clamp(2rem, 5vw, 4rem);
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0,0,0,0.35);
      text-align: center;
    }
    .eyebrow {
      margin: 0 0 0.8rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 0.78rem;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 7vw, 4.4rem);
      line-height: 1;
    }
    p {
      max-width: 680px;
      margin: 1.2rem auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.18rem);
      line-height: 1.7;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.8rem;
      margin-top: 2rem;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0.75rem 1.05rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text);
      text-decoration: none;
      background: rgba(255,255,255,0.07);
    }
    a.primary {
      background: var(--accent);
      color: #1b1608;
      border-color: transparent;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Sketches landing page</p>
    <h1>Grins</h1>
    <p>This split repository currently contains the Grins section. The broader sketches-and-drawings catalogue will be divided into additional repositories.</p>
    <div class="actions">
      <a class="primary" href="grins/index.html">Open Grins index</a>
      <a href="../index.html">Repository home</a>
    </div>
  </main>
</body>
</html>
