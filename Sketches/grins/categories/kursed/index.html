    /* Page foundations */
    :root {
      --border: #e5e7eb;
      --muted: #6b7280;
      --panel: #f8fafc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #fff;
      color: #111;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }

    .wrap {
      width: calc(100% - 36px);
      max-width: 1100px;
      margin: 0 auto;
      padding: 26px 0 48px;
    }

    /* Site and catalogue navigation */
    .nav-pills,
    .sequence-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin: 20px auto;
      text-align: center;
    }

    .nav-pill {
      display: inline-block;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #fff;
      color: #111;
      text-decoration: none;
      font-size: 14px;
      line-height: 1.4;
    }

    .nav-pill:hover,
    .nav-pill:focus-visible { background: #f9fafb; }

    /* Heading and category panel */
    .page-header { margin: 0 auto 24px; text-align: center; }
    .page-title {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.1;
    }

    .section-card {
      width: 100%;
      margin: 0 auto 24px;
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 8px 26px #0000000f;
    }

    /* Compact artwork cards */
    .index-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: stretch;
      gap: 16px;
      margin: 0 auto;
    }

    .index-card {
      display: flex;
      flex: 0 0 200px;
      flex-direction: column;
      align-items: stretch;
      width: 200px;
      min-width: 0;
      max-width: 200px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      color: inherit;
      text-align: center;
      text-decoration: none;
      box-shadow: 0 3px 12px #0000000b;
    }

    .index-card:hover {
      border-color: #c9ced5;
      box-shadow: 0 5px 16px #00000014;
    }

    .index-card > img {
      display: block;
      width: 100%;
      max-width: 100%;
      height: 158px;
      padding: 8px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      object-fit: contain;
    }

    .card-title {
      display: block;
      margin: 0;
      padding: 10px 8px 12px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .card-subtitle {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.35;
    }

    /* Footer */
    footer {
      margin: 30px auto 0;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    /* Compact mobile layout */
    @media (max-width: 480px) {
      .wrap { width: calc(100% - 24px); }
      .section-card { padding: 14px; }
      .index-grid { gap: 12px; }
      .index-card { flex: 0 1 145px; width: 145px; max-width: 145px; }
      .index-card > img { height: 140px; }
      .card-title { font-size: 13px; }
    }
  </style>
