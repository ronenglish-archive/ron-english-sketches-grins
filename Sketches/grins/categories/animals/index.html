    .section-card {
      width: 100%;
      margin: 0 auto 24px;
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 8px 26px #0000000f;
    }
    
    /* Compact category cards */
    .index-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: stretch;
      gap: 16px;
      margin: 0 auto;
    }
    .index-card {
      display: flex;
      flex: 0 0 200px;
      width: 200px;
      max-width: 200px;
      min-width: 0;
      flex-direction: column;
      align-items: stretch;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      color: inherit;
      text-decoration: none;
      text-align: center;
      box-shadow: 0 3px 12px #0000000b;
    }
    .index-card:hover { border-color: #c9ced5; box-shadow: 0 5px 16px #00000014; }
    .index-card > img {

      width: 100%;
      height: 158px;
      max-width: 100%;
      object-fit: contain;
      padding: 8px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .card-title {
      display: block;
      margin: 0;
      padding: 10px 8px 12px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }
    
    /* Footer */

      margin: 30px auto 0;
      padding: 16px 0 0;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }
    
    /* Mobile compact cards */
    @media (max-width: 480px) {
      .wrap { width: calc(100% - 24px); }
      .section-card { padding: 14px; }
      .index-grid { gap: 12px; }
      .index-card { flex: 0 1 145px; width: 145px; max-width: 145px; }
      .index-card > img { height: 140px; }
      .card-title { font-size: 13px; }
    }
