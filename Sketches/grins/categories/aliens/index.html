  text-align: center;
  box-shadow: 0 3px 12px #0000000b;
}
.index-card:hover, .index-card:focus-visible {
  border-color: #c9ced5;
  box-shadow: 0 5px 16px #00000014;
}
.index-card > img {

  background: var(--panel);
  border-bottom: 1px solid var(--border);
}
.card-title {

  margin: 0;
  padding: 10px 8px 12px;
  text-align: center;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.35;
  overflow-wrap: anywhere;
}
.card-subtitle {

  color: var(--muted);
  font-size: 12px;
  font-weight: 400;
  line-height: 1.35;
}

/* Footer */
footer {
  margin: 30px auto 0;
  padding-top: 16px;
  border-top: 1px solid var(--border);
  color: var(--muted);
  text-align: center;
  font-size: 14px;
}

/* Standard compact mobile cards */
@media (max-width: 480px) {
  .wrap { width: calc(100% - 24px); }

  .index-card { flex: 0 1 145px; width: 145px; max-width: 145px; }
  .index-card > img { height: 140px; }
  .card-title { font-size: 13px; }
